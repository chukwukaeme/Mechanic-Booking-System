{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Book a Service
</h2>


{% if error_message %}

<div class="alert alert-danger">

    {{ error_message }}

</div>

{% endif %}


<form method="POST"
      class="card p-4 shadow">

    {% csrf_token %}

    {{ form.as_p }}


    <button
        type="submit"
        class="btn btn-warning">

        Book Service

    </button>

</form>

{% endblock %}
